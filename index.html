  /* ── App ────────────────────────────────────────────────── */
  function App() {
    const [footerVisible, setFooterVisible] = useState(false);
    const menuRef  = useRef(null);
    const aboutRef = useRef(null);

    const scrollTo = (ref, offset = 12) => {
      if (ref.current) {
        const top = ref.current.getBoundingClientRect().top + window.scrollY - offset;
        window.scrollTo({ top, behavior: "smooth" });
      }
    };

    const handleSection = (name) => {
      if (name === "Work")  scrollTo(menuRef);
      if (name === "About") scrollTo(aboutRef);
      if (name === "Email Me") window.location.href = "mailto:huxirui24@gmail.com";
    };

    useEffect(() => {
      gsap.registerPlugin(ScrollTrigger);

      const onScroll = () => {
        const scrollBottom = window.scrollY + window.innerHeight;
        const docHeight    = document.documentElement.scrollHeight;
        setFooterVisible(scrollBottom >= docHeight - 80);
      };
      window.addEventListener("scroll", onScroll, { passive: true });

      return () => {
        window.removeEventListener("scroll", onScroll);
        ScrollTrigger.getAll().forEach(t => t.kill());
      };
    }, []);

    return (
      <>
        <Nav onSection={handleSection} />
        <Hero onEnter={() => scrollTo(menuRef)} />

        <div id="about-section" ref={aboutRef}>

          <MenuCard />
        </div>

        <CheckoutSection />

        <Footer visible={footerVisible} />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- ── CURTAIN SCRIPT ── -->
<script>
(function () {
  const overlay = document.getElementById('curtain-overlay');
  const canvas  = document.getElementById('curtain-canvas');
  const ctx     = canvas.getContext('2d');

  let W = window.innerWidth;
  let H = window.innerHeight;
  canvas.width  = W;
  canvas.height = H;

  // Circular bead matching nav style (8px diameter)
  const BEAD_R  = 4;
  const GAP     = 3;
  const UNIT    = BEAD_R * 2 + GAP;   // 11px per slot
  const ROWS    = Math.ceil(H / UNIT) + 2;
  const STR_W   = 13;
  const NUM_STR = Math.floor(W / STR_W);

  // Brand colours
  const RED    = '#b62824';
  const THREAD = '#2a1a18';
  const SHINE  = 'rgba(255,255,255,0.45)';

  function makeStrings() {
    return Array.from({ length: NUM_STR }, (_, i) => {
      const side = i < NUM_STR / 2 ? -1 : 1;
      const dist = side === -1 ? (NUM_STR / 2 - 1 - i) : (i - NUM_STR / 2);
      return { x: (i + 0.5) * STR_W, side, dist, swingAngle: 0, sweepX: 0, opacity: 1, started: false };
    });
  }

  let strings     = makeStrings();
  let rafId       = null;
  let globalStart = null;

  const OPEN_DUR    = 2200;
  const SWEEP_DELAY = 1400;
  const SWEEP_DUR   = 1600;
  const MAX_ANGLE   = 1.05;

  const easeOutCubic   = t => 1 - Math.pow(1 - t, 3);
  const easeInCubic    = t => t * t * t;
  const easeInOutQuart = t => t < 0.5 ? 8*t*t*t*t : 1 - Math.pow(-2*t+2,4)/2;

  function drawBead(x, y, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y, BEAD_R, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    // Specular highlight
    ctx.beginPath();
    ctx.arc(x - BEAD_R * 0.28, y - BEAD_R * 0.28, BEAD_R * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = SHINE;
    ctx.fill();
    ctx.restore();
  }

  function drawString(s) {
    if (s.opacity <= 0) return;
    const bx0 = s.x + s.sweepX;
    for (let r = 0; r < ROWS; r++) {
      const frac  = r / (ROWS - 1);
      const angle = s.swingAngle * frac * frac;
      const cy    = r * UNIT + BEAD_R;
      const bx    = bx0 + Math.sin(angle) * cy;
      drawBead(bx, cy, RED, s.opacity);
      if (r < ROWS - 1) {
        const nf  = (r + 1) / (ROWS - 1);
        const na  = s.swingAngle * nf * nf;
        const ncy = (r + 1) * UNIT + BEAD_R;
        const nbx = bx0 + Math.sin(na) * ncy;
        ctx.save();
        ctx.globalAlpha = s.opacity * 0.6;
        ctx.beginPath();
        ctx.moveTo(bx, cy + BEAD_R);
        ctx.lineTo(nbx, ncy - BEAD_R);
        ctx.strokeStyle = THREAD;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    for (const s of strings) drawString(s);
  }

  function tick(ts) {
    if (!globalStart) globalStart = ts;
    const elapsed  = ts - globalStart;
    let anyVisible = false;

    for (const s of strings) {
      if (!s.started) { anyVisible = true; continue; }
      if (s.opacity <= 0) continue;
      anyVisible = true;

      s.swingAngle = s.side * MAX_ANGLE * easeOutCubic(Math.min(1, elapsed / OPEN_DUR));

      if (elapsed > SWEEP_DELAY) {
        const t  = Math.min(1, (elapsed - SWEEP_DELAY) / SWEEP_DUR);
        s.sweepX  = s.side * (W * 0.7 + s.dist * 10) * easeInCubic(t);
        s.opacity = 1 - easeInOutQuart(t);
      }
    }

    render();

    if (anyVisible) {
      rafId = requestAnimationFrame(tick);
    } else {
      overlay.style.transition = 'opacity 0.35s ease';
      overlay.style.opacity    = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
      }, 380);
    }
  }

  function startCurtain() {
    document.body.style.overflow = 'hidden';
    globalStart = null;
    strings.forEach(s => {
      const delay = s.dist * 50 + Math.random() * 30;
      setTimeout(() => { s.started = true; }, delay);
    });
    setTimeout(() => { rafId = requestAnimationFrame(tick); }, 20);
  }

  window.addEventListener('load', () => {
    render();
    setTimeout(startCurtain, 300);
  });

  window.addEventListener('resize', () => {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W;
    canvas.height = H;
  });
})();
</script>
